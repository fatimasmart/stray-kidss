    <h1>The Heart and Blood Vessels</h1>

    <h2>The Heart</h2>
    <p>The heart is a strong muscle that pumps blood all over your body. It never stops beating!</p>
    <img src="v4-460px-Human-Heart-Drawing-Diagram.jpg" alt="Heart Diagram" width="300">

    <h2>Blood Vessels</h2>
    <ul>
        <li><b>Arteries</b> – carry blood away from the heart</li>
        <li><b>Veins</b> – bring blood back to the heart</li>
        <li><b>Capillaries</b> – connect arteries and veins</li>
    </ul>
